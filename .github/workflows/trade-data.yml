name: Trade data update

# Downloads the data of the trade website (leagues, filters, currency, item types) of PoE 1 and 2, for every language,
# as the "update all" button of the configuration window does, and proposes the json files of the library in a pull request to dev.
# The files generated from the game are updated by dat-to-json.yml.

on:
  workflow_dispatch:
  # At the start of a league or after a patch, or on a schedule (example: every day at 04:43 UTC):
  # schedule:
  #   - cron: '43 4 * * *'

permissions:
  contents: write
  pull-requests: write

# One run at a time: two runs would update the same branch.
concurrency:
  group: trade-data
  cancel-in-progress: false

jobs:
  update:
    # Never in a fork.
    if: github.repository == 'maxensas/xiletrade'
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      OUTPUT: src/Xiletrade.Library/Data/Lang
      REPORT: trade-data-report.md

    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Exit code: 0 success, 1 some files not downloaded (the others are written), 2 nothing downloaded or error.
      # SkipOozBuild: the game decompressor is not needed to read the trade website.
      - name: Update json files
        id: trade
        shell: bash
        run: |
          set +e
          dotnet run --project src/Xiletrade.DatToJson -c Release -p:SkipOozBuild=true -- trade --game all \
            --output "$OUTPUT" --report "$REPORT"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-data-report
          path: ${{ env.REPORT }}
          if-no-files-found: ignore

      - name: Stop when nothing was downloaded
        if: steps.trade.outputs.exit != '0' && steps.trade.outputs.exit != '1'
        shell: bash
        run: |
          echo "::error::Trade data exit code ${{ steps.trade.outputs.exit }}: see the trade-data-report artifact. Nothing is committed."
          exit 1

      - name: Warn about the files not downloaded
        if: steps.trade.outputs.exit == '1'
        shell: bash
        run: echo "::warning::Some files could not be downloaded, their previous version is kept (see the report)."

      - name: Check changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- "$OUTPUT")" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No change since the last update."
          fi

      # A pull request opened with GITHUB_TOKEN does not start the other workflows (CI.yml): the tests run here,
      # with the new files.
      - name: Test
        if: steps.changes.outputs.found == 'true'
        working-directory: src
        run: dotnet test -c Release -p:SkipOozBuild=true --filter-not-namespace "Xiletrade.Test.Exploratory*"

      # A pull request body is limited to 65536 characters: the diff blocks are left out when the report is too long.
      - name: Pull request body
        if: steps.changes.outputs.found == 'true'
        shell: bash
        run: |
          {
            echo "Generated by [trade data run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            if [ "$(wc -c < "$REPORT")" -le 60000 ]; then
              cat "$REPORT"
            else
              awk '/^```diff$/ { skip = 1; print "_Diff too long: see the trade-data-report artifact of the run._"; next }
                   skip && /^```$/ { skip = 0; next }
                   !skip' "$REPORT" | head -c 60000
            fi
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Pull request
        if: steps.changes.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: dev
          branch: tradeData/update
          delete-branch: true
          title: Trade data update
          commit-message: Trade data update
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: |
            src/Xiletrade.Library/Data/Lang
