name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        working-directory: src
        run: dotnet test -c Release --filter-not-namespace "Xiletrade.Test.Exploratory*"