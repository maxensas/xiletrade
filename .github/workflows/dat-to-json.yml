name: Game data update (DatToJson)

# Regenerates the json files read from the game (bases, mods, monsters, words, gems, item classes) for PoE 1 and 2,
# from the patch CDN, and proposes them in a pull request to dev. Nothing is pushed to dev or master:
# Xiletrade/Data/Lang on master is downloaded by every Xiletrade client, a change reaches users only once merged by hand.

on:
  workflow_dispatch:
  # After each game update, or on a schedule (example: every day at 05:17 UTC):
  # schedule:
  #   - cron: '17 5 * * *'

permissions:
  contents: write
  pull-requests: write

# One run at a time: two runs would update the same branch.
concurrency:
  group: dat-to-json
  cancel-in-progress: false

jobs:
  update:
    # Never in a fork.
    if: github.repository == 'maxensas/xiletrade'
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      GENERATED: Xiletrade/Data/Lang
      LIBRARY: src/Xiletrade.Library/Data/Lang
      REPORT: datToJson-report.md

    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Exit code: 0 success, 1 manual action required, 2 error. The step goes on, the code is checked below.
      - name: Update json files
        id: datToJson
        shell: bash
        run: |
          set +e
          dotnet run --project src/Xiletrade.DatToJson -c Release -- fullupdate --game all --cdn current \
            --output "$GENERATED" --report "$REPORT"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datToJson-report
          path: ${{ env.REPORT }}
          if-no-files-found: ignore

      # With --game all, the other game may have been written: nothing is committed.
      - name: Stop when a manual action is needed
        if: steps.datToJson.outputs.exit != '0'
        shell: bash
        run: |
          echo "::error::DatToJson exit code ${{ steps.datToJson.outputs.exit }}: see the datToJson-report artifact. Nothing is committed."
          exit 1

      # Only the files written by this run (unchanged files are not rewritten): hand-made files
      # (ParsingRules.json, chinese files of the Tencent client...) are never copied.
      - name: Copy generated files to the library
        shell: bash
        run: |
          git ls-files --modified --others --exclude-standard -- "$GENERATED" | while IFS= read -r file; do
            target="$LIBRARY/${file#"$GENERATED"/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
            echo "$file -> $target"
          done

      - name: Check changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- "$GENERATED" "$LIBRARY" src/Xiletrade.DatToJson/Schemas)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No change since the last generation."
          fi

      # A pull request opened with GITHUB_TOKEN does not start the other workflows (CI.yml): the tests run here,
      # with the new files.
      - name: Test
        if: steps.changes.outputs.found == 'true'
        working-directory: src
        run: dotnet test -c Release --filter-not-namespace "Xiletrade.Test.Exploratory*"

      # A pull request body is limited to 65536 characters: the diff blocks are left out when the report is too long.
      - name: Pull request body
        if: steps.changes.outputs.found == 'true'
        shell: bash
        run: |
          {
            echo "Generated by [DatToJson run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            if [ "$(wc -c < "$REPORT")" -le 60000 ]; then
              cat "$REPORT"
            else
              awk '/^```diff$/ { skip = 1; print "_Diff too long: see the datToJson-report artifact of the run._"; next }
                   skip && /^```$/ { skip = 0; next }
                   !skip' "$REPORT" | head -c 60000
            fi
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Pull request
        if: steps.changes.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: dev
          branch: datToJson/update
          delete-branch: true
          title: Game data update (DatToJson)
          commit-message: Game data update (DatToJson)
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: |
            Xiletrade/Data/Lang
            src/Xiletrade.Library/Data/Lang
            src/Xiletrade.DatToJson/Schemas
